<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo usuario</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <header class="admin-header">
        <h1 class="logo-admin">Panel Administrador</h1>
        <nav><a href="index.html">Inicio</a><a href="productos.html">Productos</a><a href="usuarios.html" class="active">Usuarios</a><a href="../index.html">Tienda</a></nav>
    </header>
    <main class="admin-contenedor">
        <h1 class="admin-titulo">Nuevo usuario</h1>
        <form class="admin-formulario" onsubmit="guardarNuevoUsuario(); return false;">
            <div class="campo"><label for="nombre">Nombre completo</label><input id="nombre" required></div>
            <div class="campo"><label for="correo">Correo electrónico</label><input id="correo" type="email" required></div>
            <div class="campo">
                <label for="rol">Rol</label>
                <select id="rol"><option>Cliente</option><option>Administrador</option></select>
            </div>
            <button class="btn" type="submit">Guardar usuario</button>
            <a class="btn btn-secundario" href="usuarios.html">Cancelar</a>
        </form>
    </main>
    <footer><p>&copy; 2026 Pastelería 1000 Sabores</p></footer>
    <script src="../js/script.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
