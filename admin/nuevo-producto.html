<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo producto</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <header class="admin-header">
        <h1 class="logo-admin">Panel Administrador</h1>
        <nav><a href="index.html">Inicio</a><a href="productos.html" class="active">Productos</a><a href="usuarios.html">Usuarios</a><a href="../index.html">Tienda</a></nav>
    </header>

    <main class="admin-contenedor">
        <h1 class="admin-titulo">Nuevo producto</h1>
        <form class="admin-formulario" onsubmit="guardarNuevoProducto(); return false;">
            <div class="campo"><label for="codigo">Código</label><input id="codigo" required></div>
            <div class="campo"><label for="nombre">Nombre</label><input id="nombre" required></div>
            <div class="campo"><label for="categoria">Categoría</label><input id="categoria" required></div>
            <div class="campo"><label for="precio">Precio</label><input id="precio" type="number" min="0" required></div>
            <div class="campo"><label for="descripcion">Descripción</label><textarea id="descripcion" required></textarea></div>
            <div class="campo"><label for="imagen">Nombre de la imagen</label><input id="imagen" placeholder="Ejemplo.jpeg"></div>
            <button class="btn" type="submit">Guardar producto</button>
            <a class="btn btn-secundario" href="productos.html">Cancelar</a>
        </form>
    </main>

    <footer><p>&copy; 2026 Pastelería 1000 Sabores</p></footer>
    <script src="../js/script.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
